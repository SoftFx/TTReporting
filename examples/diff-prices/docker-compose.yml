services:
  diff-prices-local:
    image: diff-prices
    environment:
      PG_PASSWORD: ${PG_PASSWORD}
      HSM_PRODUCT_KEY: ${HSM_PRODUCT_KEY}
    volumes:
      - ../../source/diff-prices/configDocker:/app/configDocker:ro
      - ../../source/diff-prices/dataDocker:/app/dataDocker:rw
    restart: "no"

